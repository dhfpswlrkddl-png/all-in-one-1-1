<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubuntu 기반 커스텀 NGINX 서버</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #772953 0%, #E95420 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 580px;
            padding: 36px 32px;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: #fdf2f8;
            color: #be185d;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 9999px;
            margin-bottom: 16px;
        }
        h1 {
            color: #1e293b;
            font-size: 26px;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 28px;
        }
        .info-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            text-align: left;
            margin-bottom: 24px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #cbd5e1;
            font-size: 14px;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #64748b;
            font-weight: 500;
        }
        .info-value {
            color: #0f172a;
            font-weight: 600;
        }
        .status-badge {
            color: #16a34a;
            background: #dcfce7;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .footer {
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">🐧 Ubuntu Linux + Custom NGINX</span>
        <h1>Ubuntu 기반 커스텀 NGINX 서버</h1>
        <p class="subtitle">Ubuntu 베이스 이미지에 NGINX를 직접 설치하고 커스텀 구성했습니다.</p>

        <div class="info-box">
            <div class="info-row">
                <span class="info-label">베이스 이미지</span>
                <span class="info-value">Ubuntu 24.04 LTS</span>
            </div>
            <div class="info-row">
                <span class="info-label">설치 패키지</span>
                <span class="info-value">nginx, curl, ca-certificates</span>
            </div>
            <div class="info-row">
                <span class="info-label">서비스 포트</span>
                <span class="info-value">8080 (커스텀 설정)</span>
            </div>
            <div class="info-row">
                <span class="info-label">헬스체크 (HEALTHCHECK)</span>
                <span class="status-badge">활성화 (Healthy)</span>
            </div>
            <div class="info-row">
                <span class="info-label">환경 구분</span>
                <span class="info-value">Production</span>
            </div>
        </div>

        <div class="footer">
            Docker Mission 1-1 &bull; Linux Base & Custom Installation Demonstration
        </div>
    </div>
</body>
</html>
